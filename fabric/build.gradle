loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('DigiCube Client (Fabric)')
            ideConfigGenerated(true)
            runDir('runs/client')
            // A fixed name keeps the offline UUID, and with it the owned Digivice and party, across launches.
            programArgs('--username', 'Dev')
        }
        server {
            server()
            setConfigName('DigiCube Server (Fabric)')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// --- Plumbing: marks this module's classpath as the 'fabric' variant --------
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
// Matched lazily: the sources and javadoc variants only exist when extra_jars is on.
configurations.matching { it.name in ['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'] }.configureEach {
    attributes { attribute(loaderAttribute, 'fabric') }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named("$variant") {
            attributes { attribute(loaderAttribute, 'fabric') }
        }
    }
}

