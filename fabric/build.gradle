plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

// Exercise the real client model without opening a window or creating an OpenGL context.
sourceSets {
    nativeTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
tasks.register('nativeFlightTest', JavaExec) {
    dependsOn tasks.named('nativeTestClasses')
    classpath = sourceSets.nativeTest.runtimeClasspath
    mainClass = 'com.digicube.fabric.client.model.NativeFlightRegressionTest'
    workingDir = layout.buildDirectory.dir('native-flight-test').get().asFile
    doFirst { workingDir.mkdirs() }
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(java_version) }
}
tasks.named('check') { dependsOn tasks.named('nativeFlightTest') }
tasks.register('nativeGesomonTest', JavaExec) {
    dependsOn tasks.named('nativeTestClasses')
    classpath = sourceSets.nativeTest.runtimeClasspath
    mainClass = 'com.digicube.fabric.client.model.NativeGesomonRegressionTest'
    if (project.hasProperty('gesomonEvidence')) args project.property('gesomonEvidence')
    workingDir = layout.buildDirectory.dir('native-gesomon-test').get().asFile
    doFirst { workingDir.mkdirs() }
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(java_version) }
}
tasks.named('check') { dependsOn tasks.named('nativeGesomonTest') }

tasks.register('nativeIkkakumonTest', JavaExec) {
    dependsOn tasks.named('nativeTestClasses')
    classpath = sourceSets.nativeTest.runtimeClasspath
    mainClass = 'com.digicube.fabric.client.model.NativeIkkakumonRegressionTest'
    if (project.hasProperty('ikkakumonEvidence')) args project.property('ikkakumonEvidence')
    workingDir = layout.buildDirectory.dir('native-ikkakumon-test').get().asFile
    doFirst { workingDir.mkdirs() }
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(java_version) }
}
tasks.named('check') { dependsOn tasks.named('nativeIkkakumonTest') }

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('DigiCube Client (Fabric)')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('DigiCube Server (Fabric)')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// --- Plumbing: marks this module's classpath as the 'fabric' variant --------
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
// Matched lazily: the sources and javadoc variants only exist when extra_jars is on.
configurations.matching { it.name in ['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'] }.configureEach {
    attributes { attribute(loaderAttribute, 'fabric') }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named("$variant") {
            attributes { attribute(loaderAttribute, 'fabric') }
        }
    }
}
