# =============================================================================
#  DigiCube build configuration
#
#  IMPORTANT: every property you add here that needs to be readable from a
#  resource file (fabric.mod.json, pack.mcmeta, *.mixins.json) must ALSO be
#  added to the `expandProps` map in
#  buildSrc/src/main/groovy/multiloader-common.gradle
# =============================================================================

# --- Project ---------------------------------------------------------------
# Version scheme: <minecraft_version>.<mod_major>.<mod_minor>
version=26.2.0.1
group=com.digicube
java_version=25

# --- Mod identity ----------------------------------------------------------
mod_id=digicube
mod_name=DigiCube
mod_author=Ricardo
license=MIT
credits=
description=Digimon in Minecraft: tame, raise, train and digivolve your partner.

# --- Minecraft -------------------------------------------------------------
minecraft_version=26.2
minecraft_version_range=[26.2, 26.3)
# The plain Minecraft the `common` module compiles against.
# Versions: https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.2-1

# --- Fabric ----------------------------------------------------------------
# New versions: https://fabricmc.net/develop/
fabric_version=0.159.0+26.2
fabric_loader_version=0.19.5

# --- NeoForge (unused until the `neoforge` module exists) ------------------
# New versions: https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.2.0.75
neoforge_loader_version_range=[4,)

# --- Gradle ----------------------------------------------------------------
# Minecraft decompilation is memory hungry. Lower this if your machine struggles.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
org.gradle.parallel=true
