name: Roadmap sync

# The issue list is the source of truth; this copies each issue's state into the Status field of the
# Roadmap project (user project 1): closed -> Done, "in progress" label -> In Progress, otherwise Todo.

on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: roadmap-sync-${{ github.event.issue.number || 'all' }}
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'in progress'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.ROADMAP_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      PROJECT: 1
      REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - name: Sync status
        run: |
          set -euo pipefail
          err="$RUNNER_TEMP/gh-errors.log"
          : > "$err"
          trap 'code=$?; if [ "$code" -ne 0 ]; then echo "::error::Failed at: $BASH_COMMAND -- $(tail -c 1500 "$err" | tr "\n" " ")"; fi' EXIT
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret ROADMAP_TOKEN is missing (classic token with the project scope)"
            exit 1
          fi

          project=$(gh api graphql 2>>"$err" -F number="$PROJECT" -f login="$OWNER" -f query='
            query($login: String!, $number: Int!) {
              user(login: $login) {
                projectV2(number: $number) {
                  id
                  field(name: "Status") { ... on ProjectV2SingleSelectField { id options { id name } } }
                }
              }
            }' --jq '.data.user.projectV2')
          project_id=$(jq -r .id <<<"$project")
          field_id=$(jq -r .field.id <<<"$project")
          option_id() {
            jq -r --arg name "$1" '.field.options[] | select(.name == $name) | .id' <<<"$project"
          }

          sync() {
            local issue status item
            issue=$(gh issue view "$1" --repo "$REPO" --json id,state,labels 2>>"$err")
            if [ "$(jq -r .state <<<"$issue")" = "CLOSED" ]; then
              status="Done"
            elif jq -e '.labels[] | select(.name == "in progress")' <<<"$issue" >/dev/null; then
              status="In Progress"
            else
              status="Todo"
            fi
            item=$(gh api graphql 2>>"$err" -f project="$project_id" -f content="$(jq -r .id <<<"$issue")" -f query='
              mutation($project: ID!, $content: ID!) {
                addProjectV2ItemById(input: {projectId: $project, contentId: $content}) { item { id } }
              }' --jq '.data.addProjectV2ItemById.item.id')
            gh api graphql >/dev/null 2>>"$err" -f project="$project_id" -f item="$item" -f field="$field_id" \
              -f option="$(option_id "$status")" -f query='
              mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                updateProjectV2ItemFieldValue(input: {projectId: $project, itemId: $item, fieldId: $field,
                  value: {singleSelectOptionId: $option}}) { projectV2Item { id } }
              }'
            echo "#$1 -> $status"
          }

          if [ -n "${ISSUE:-}" ]; then
            sync "$ISSUE"
          else
            for number in $(gh issue list --repo "$REPO" --state all --limit 1000 --json number --jq '.[].number' 2>>"$err"); do
              sync "$number"
            done
          fi
