name: Release

# A pushed v* tag builds the Fabric jar and uploads it to CurseForge, with the tag message's body as its changelog.
# Run by hand it is a dry run: the same checks and build, and no upload. agents/releasing.md has the steps.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  curseforge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the changelog
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            if [ "$tag" != "v$version" ]; then
              echo "::error::Tag $tag does not match version=$version in gradle.properties"; exit 1
            fi
            # The checkout may hold the tag as a plain ref; fetch the annotated tag itself to read its message.
            git fetch --depth=1 --force origin "+refs/tags/$tag:refs/tags/$tag"
            if [ "$(git cat-file -t "$tag")" != tag ]; then
              echo "::error::$tag is not an annotated tag, so it holds no changelog"; exit 1
            fi
            changelog=$(git for-each-ref --format='%(contents:body)' "refs/tags/$tag")
            if [ -z "$(printf '%s' "$changelog" | tr -d '[:space:]')" ]; then
              echo "::error::The message of $tag holds no changelog below its first line"; exit 1
            fi
          else
            changelog="Dry run of $version from ${GITHUB_SHA::7}: nothing is uploaded."
          fi
          { echo 'RELEASE_CHANGELOG<<END_OF_CHANGELOG'; printf '%s\n' "$changelog"; echo 'END_OF_CHANGELOG'; } >> "$GITHUB_ENV"
          { echo "## Changelog of $version"; echo; printf '%s\n' "$changelog"; } >> "$GITHUB_STEP_SUMMARY"

      # The same lookups the upload makes, read-only: the token works and CurseForge knows every version tag.
      - name: Check CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          if [ -z "$CURSEFORGE_TOKEN" ]; then echo "::error::The CURSEFORGE_TOKEN secret is missing"; exit 1; fi
          api=https://minecraft.curseforge.com/api/game
          curl -fsS -H "X-Api-Token: $CURSEFORGE_TOKEN" "$api/version-types" -o types.json \
            || { echo "::error::CurseForge refused the token"; exit 1; }
          curl -fsS -H "X-Api-Token: $CURSEFORGE_TOKEN" "$api/versions" -o versions.json \
            || { echo "::error::CurseForge refused the token"; exit 1; }
          python3 - "$(sed -n 's/^minecraft_version=//p' gradle.properties)" <<'EOF'
          import json, sys
          types = json.load(open('types.json'))
          versions = json.load(open('versions.json'))
          # Minecraft versions sit under every type whose slug starts with "minecraft"; the rest under one slug.
          for kind, name in [('minecraft', sys.argv[1]), ('modloader', 'fabric'),
                             ('environment', 'client'), ('environment', 'server')]:
              ids = {t['id'] for t in types
                     if (t['slug'].startswith('minecraft') if kind == 'minecraft' else t['slug'] == kind)}
              if not any(v['gameVersionTypeID'] in ids and v['name'].lower() == name.lower() for v in versions):
                  print(f'::error::CurseForge has no {kind} version named {name}')
                  sys.exit(1)
              print(f'CurseForge knows {kind} {name}')
          EOF
          rm types.json versions.json

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      # Only a pushed tag passes the token on; without it the plugin makes a dry run.
      - name: Upload to CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ github.event_name == 'push' && secrets.CURSEFORGE_TOKEN || '' }}
        run: ./gradlew :fabric:publishMods --stacktrace
