plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

// Gives this module a plain, un-modded Minecraft to compile against.
// No loader APIs are on the classpath here -- that is the point.
neoForge {
    neoFormVersion = neo_form_version

    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // Fabric and NeoForge both bundle MixinExtras, so it is safe to use in common.
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.5.3'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.5.3'
}

// --- Plumbing: exposes this module's raw sources to the loader modules -------
configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes { attribute(loaderAttribute, 'common') }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named("$variant") {
            attributes { attribute(loaderAttribute, 'common') }
        }
    }
}

// Exercise party persistence, authorization and combat packets without starting a Minecraft world.
sourceSets.create('partyTest') {
    compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    runtimeClasspath += output + compileClasspath
}
tasks.register('partyTest', JavaExec) {
    dependsOn tasks.named('partyTestClasses')
    classpath = sourceSets.partyTest.runtimeClasspath
    mainClass = 'com.digicube.party.PartyRegressionTest'
    workingDir = layout.buildDirectory.dir('party-test').get().asFile
    doFirst { workingDir.mkdirs() }
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(java_version)
    }
}
tasks.named('check') { dependsOn tasks.named('partyTest') }

